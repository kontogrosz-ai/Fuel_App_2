name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generowanie czystej struktury Android
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.fueltracker

      - name: Przywrócenie uprawnień mikrofonu dla rozpoznawania mowy
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace(
                  '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">',
                  '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />',
              )
          if 'android.speech.RecognitionService' not in text:
              text = text.replace(
                  '<application',
                  '    <queries>\n        <intent>\n            <action android:name=\"android.speech.RecognitionService\" />\n        </intent>\n    </queries>\n\n    <application',
                  1,
              )
          manifest.write_text(text)
          PY2

      - name: Globalna konfiguracja Gradle (Init Script)
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/flutter_override.gradle
          gradle.allprojects { p ->
              p.afterEvaluate {
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion = 36
                      p.android.buildToolsVersion = "34.0.0"
                      if (p.plugins.hasPlugin('com.android.application')) {
                          p.android.buildTypes.release.signingConfig = p.android.signingConfigs.debug
                      }
                  }
              }
          }
          EOF

          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Konfiguracja ProGuard
        run: |
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          EOF

      - name: Pobranie zależności Fluttera
        run: flutter pub get

      - name: Budowanie pliku APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Przeniesienie i zmiana nazwy APK
        run: |
          mkdir -p build/app/outputs/renamed
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/renamed/10_Fuel_App_GLOS_POPRAWA.apk

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: 10_Fuel_App_GLOS_POPRAWA
          path: build/app/outputs/renamed/10_Fuel_App_GLOS_POPRAWA.apk
