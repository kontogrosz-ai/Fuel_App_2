name: Build Fuel App 2.0

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Create Android project if needed
        shell: bash
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name fuel_app

      - name: Add microphone permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace('<application', permission + '    <application', 1)
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fuel-app-2.0-apk
          path: build/app/outputs/flutter-apk/app-release.apk
