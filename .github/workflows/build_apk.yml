name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Instalacja Javy (Temurin JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Kontrola właściwego kodu Fuel App
        run: |
          test -f lib/main.dart
          grep -q 'class FuelApp' lib/main.dart
          grep -q 'speech_to_text' lib/main.dart
          grep -q 'Excel.decodeBytes' lib/main.dart
          echo "OK: budowany jest właściwy Fuel App, a nie domyślna aplikacja Flutter."

      - name: Generowanie struktury Android
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.fueltracker

      - name: Przywrócenie uprawnień Fuel App
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
          ]
          marker = '<application'
          block = '\n'.join(perms) + '\n\n    '
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, block + marker, 1)
          if '<queries>' not in s:
              q = '''    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n\n'''
              s = s.replace('<application', q + '<application', 1)
          p.write_text(s)
          PY

      - name: Globalna konfiguracja Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'GRADLE' > ~/.gradle/init.d/flutter_override.gradle
          gradle.allprojects { p ->
              p.afterEvaluate {
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion = 36
                      p.android.buildToolsVersion = "34.0.0"
                      if (p.plugins.hasPlugin('com.android.application')) {
                          p.android.buildTypes.release.signingConfig = p.android.signingConfigs.debug
                      }
                  }
              }
          }
          GRADLE
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Konfiguracja ProGuard
        run: |
          cat << 'PROGUARD' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          PROGUARD

      - name: Pobranie zależności Fluttera
        run: flutter pub get

      - name: Budowanie pliku APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Kontrola APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Przeniesienie i zmiana nazwy APK
        run: |
          mkdir -p build/app/outputs/renamed
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/renamed/Fuel_App.apk

      - name: Udostępnienie pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Fuel_App
          path: build/app/outputs/renamed/Fuel_App.apk
