name: fuel_app
description: Aplikacja do śledzenia zużycia paliwa (LPG i PB) z funkcją OCR.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
