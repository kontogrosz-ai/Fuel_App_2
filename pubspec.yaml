name: fuel_app
description: "Aplikacja do monitorowania tankowań i zużycia paliwa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
